apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: home-infra-agent-readonly
  labels:
    app.kubernetes.io/name: home-infra-agent
    app.kubernetes.io/managed-by: ops-autopilot
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: home-infra-agent-readonly
  labels:
    app.kubernetes.io/name: home-infra-agent
    app.kubernetes.io/managed-by: ops-autopilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: home-infra-agent-readonly
subjects:
  - kind: ServiceAccount
    name: home-infra-agent
    namespace: home-infra-agent
