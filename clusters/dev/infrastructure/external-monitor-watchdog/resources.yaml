apiVersion: v1
kind: Namespace
metadata:
  name: external-monitor
  labels:
    app.kubernetes.io/managed-by: ops-autopilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchdog
  namespace: external-monitor
  labels:
    app.kubernetes.io/managed-by: ops-autopilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: watchdog-health
  labels:
    app.kubernetes.io/name: watchdog
    app.kubernetes.io/managed-by: ops-autopilot
rules:
  - nonResourceURLs:
      - /readyz
      - /livez
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: watchdog-health
  labels:
    app.kubernetes.io/name: watchdog
    app.kubernetes.io/managed-by: ops-autopilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: watchdog-health
subjects:
  - kind: ServiceAccount
    name: watchdog
    namespace: external-monitor
