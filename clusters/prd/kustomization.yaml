apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Child Applications use sync waves; this list is registration, not dependency ordering.
  - base-app-project.yaml
  - metallb.yaml
  - infrastructure.yaml
  - ingress-nginx.yaml
  - cert-manager.yaml
  - ceph-csi-rbd.yaml
  - ceph-csi-cephfs.yaml
  - monitoring.yaml
  # DBs and other stateful services
  - ../../applications/postgres/app-prd.yaml
  # Applications
  - ../../applications/investory/app-prd.yaml
  - ../../applications/smartapp/app-prd.yaml
  # Add new app app-prd.yaml references here to deploy to prd
