apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Child Applications use sync waves; this list is registration, not dependency ordering.
  - base-app-project.yaml
  - secrets-platform.yaml
  - secrets-workloads.yaml
  - secrets-postgres.yaml
  - metallb.yaml
  - platform-infrastructure.yaml
  - argocd-infrastructure.yaml
  - ingress-nginx.yaml
  - ceph-csi-rbd.yaml
  - monitoring.yaml
  - monitoring-rules.yaml
  # DBs and other stateful services
  - workloads/postgres.yaml
  # Applications
  - workloads/investory.yaml
  - workloads/smartapp.yaml
  # Add new workload Application manifests under workloads/ to deploy to prd
