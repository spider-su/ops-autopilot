apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform-app
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.2.2
    helm:
      values: |
        grafana:
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
            hosts:
              - grafana.home.k3s.com
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            initialDelaySeconds: 300
            timeoutSeconds: 30
            failureThreshold: 6
          sidecar:
            resources:
              requests:
                cpu: 5m
                memory: 96Mi
              limits:
                cpu: 50m
                memory: 128Mi
            dashboards:
              enabled: true
              searchNamespace: "monitoring"
            datasources:
              enabled: true
              searchNamespace: "monitoring"

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

        kubelet:
          serviceMonitor:
            # Keep kubelet, cAdvisor, and probe endpoints on the same cadence as
            # Prometheus so the enabled 2m and 5m rules have usable samples.
            interval: 60s

        # These components are not separately exposed by this k3s control plane.
        # Disable their ServiceMonitors as well as their default rule groups.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

        defaultRules:
          # These control-plane endpoints are not exposed by the k3s deployment in this homelab.
          # Keeping their upstream rules enabled produces persistent false-positive alerts.
          rules:
            kubeControllerManager: false
            kubeScheduler: false
            kubeProxy: false

        prometheus:
          prometheusSpec:
            # A 60-second cadence keeps the enabled 2m and 5m rules meaningful while
            # remaining deliberately less aggressive than the chart defaults.
            retention: 3d
            scrapeInterval: 60s
            evaluationInterval: 60s
            walCompression: true
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: proxmox-ceph-rbd
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 350m
                memory: 2Gi

        alertmanager:
          enabled: true
          config:
            global:
              smtp_smarthost: smtp.gmail.com:587
              smtp_from: a.serobaba@gmail.com
              smtp_auth_username: a.serobaba@gmail.com
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-password
            route:
              receiver: email
              group_by:
                - alertname
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
            receivers:
              - name: "null"
              - name: email
                email_configs:
                  - to: a.serobaba@gmail.com
                    send_resolved: true
          alertmanagerSpec:
            secrets:
              - alertmanager-smtp
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: proxmox-ceph-rbd
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

