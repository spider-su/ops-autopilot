apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: base-app
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.2.2
    helm:
      values: |
        grafana:
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
            hosts:
              - grafana.home.k3s.com
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            initialDelaySeconds: 300
            timeoutSeconds: 30
            failureThreshold: 6
          sidecar:
            resources:
              requests:
                cpu: 5m
                memory: 96Mi
              limits:
                cpu: 50m
                memory: 128Mi
            dashboards:
              enabled: true
              searchNamespace: "monitoring"
            datasources:
              enabled: true
              searchNamespace: "monitoring"

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

        kubelet:
          serviceMonitor:
            # Keep kubelet, cAdvisor, and probe endpoints on the same low-frequency
            # profile as Prometheus. The chart otherwise forces cAdvisor to 10s.
            interval: 360s

        defaultRules:
          # These control-plane endpoints are not exposed by the k3s deployment in this homelab.
          # Keeping their upstream rules enabled produces persistent false-positive alerts.
          rules:
            kubeControllerManager: false
            kubeScheduler: false
            kubeProxy: false

        prometheus:
          prometheusSpec:
            # Lower-frequency collection/evaluation reduces API, CPU, and disk use.
            retention: 3d
            scrapeInterval: 360s
            evaluationInterval: 180s
            walCompression: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 350m
                memory: 2Gi

        alertmanager:
          # No notification receiver is configured yet. Keep Alertmanager disabled rather than
          # presenting a healthy-looking null route that silently drops every alert.
          enabled: false
          alertmanagerSpec:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

