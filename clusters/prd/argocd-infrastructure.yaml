apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-app
  source:
    repoURL: https://github.com/spider-su/ops-autopilot.git
    targetRevision: main
    path: infrastructure/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      # Argo's client-side apply annotation cannot hold the large upstream CRDs.
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: argocd-secret
      namespace: argocd
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: argocd-notifications-secret
      namespace: argocd
      jsonPointers:
        - /data
