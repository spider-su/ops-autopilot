apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: base-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  sourceRepos:
    - https://github.com/spider-su/ops-autopilot.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: investory-prod
    - server: https://kubernetes.default.svc
      namespace: investory-dev
    - server: https://kubernetes.default.svc
      namespace: smartapp-prod
    - server: https://kubernetes.default.svc
      namespace: smartapp-dev
    - server: https://kubernetes.default.svc
      namespace: postgres
    - server: https://kubernetes.default.svc
      namespace: postgres-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: ""
      kind: ResourceQuota

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  sourceRepos:
    - https://github.com/spider-su/ops-autopilot.git
    - https://kubernetes.github.io/ingress-nginx
    - https://metallb.github.io/metallb
    - https://prometheus-community.github.io/helm-charts
    - https://ceph.github.io/csi-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: infrastructure
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: ceph-csi-rbd
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: ResourceQuota
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: metallb.io
      kind: IPAddressPool
    - group: metallb.io
      kind: L2Advertisement
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

