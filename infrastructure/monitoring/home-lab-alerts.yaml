apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-lab-alerts
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: monitoring
spec:
  groups:
    - name: home-lab.nodes
      rules:
        - alert: KubeNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes node is not ready
            description: "Node {{ $labels.node }} has been NotReady for more than 10 minutes."

        - alert: KubeNodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes node reports memory pressure
            description: "Node {{ $labels.node }} has reported MemoryPressure for more than 10 minutes."

        - alert: NodeFilesystemSpaceLow
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
              /
              node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
            ) < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node root filesystem has little free space
            description: "Node {{ $labels.instance }} has less than 15% free space on /."

    - name: home-lab.workloads
      rules:
        - alert: KubePodCrashLooping
          expr: |
            max_over_time(
              kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]
            ) >= 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Pod is crash looping
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff."

        - alert: KubeDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas
              != kube_deployment_status_replicas_available
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Deployment has unavailable replicas
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas for more than 15 minutes."

        - alert: KubeStatefulSetReplicasMismatch
          expr: |
            kube_statefulset_replicas
              != kube_statefulset_status_replicas_ready
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: StatefulSet has unavailable replicas
            description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has unavailable replicas for more than 15 minutes."
