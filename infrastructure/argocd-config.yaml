# Disables argocd-server's built-in TLS so ingress-nginx can proxy plain HTTP.
# Traefik handles TLS externally.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
  # Cache application state longer between passive full comparisons.
  controller.app.state.cache.expiration: "600s"
  # Trade reconciliation throughput for lower steady-state controller CPU.
  controller.status.processors: "3"
  controller.operation.processors: "1"

---
# Application reconciliation cadence is configured in argocd-cm, separately
# from controller command parameters in argocd-cmd-params-cm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  timeout.reconciliation: "600s"

