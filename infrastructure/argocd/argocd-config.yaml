# Disables argocd-server's built-in TLS so ingress-nginx can proxy plain HTTP.
# Traefik handles TLS externally.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
  controller.app.state.cache.expiration: "600s"
  controller.status.processors: "3"
  controller.operation.processors: "1"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Temporary until Phase 2 removes cross-directory references.
  kustomize.buildOptions: "--load-restrictor=LoadRestrictionsNone"
  timeout.reconciliation: "600s"
