apiVersion: v1
kind: Secret
metadata:
  name: ceph-csi-secret
  namespace: default
type: kubernetes.io/rbd
# Data is intentionally not stored in git.
# After bootstrapping prd, run once:
#   kubectl delete secret ceph-csi-secret -n default
#   kubectl create secret generic ceph-csi-secret \
#     --from-literal=userID=admin \
#     --from-literal=userKey=$(ceph auth get-key client.admin) \
#     --namespace=default --dry-run=client -o yaml | \
#     kubectl patch -f - --type merge -p '{"type":"kubernetes.io/rbd"}' 2>/dev/null || \
#   kubectl apply -f - --overwrite
# Argo CD will not overwrite /data (ignoreDifferences + RespectIgnoreDifferences on the owning Application).
