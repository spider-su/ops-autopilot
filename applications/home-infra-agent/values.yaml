replicaCount: 1

image:
  repository: aserobaba/home-infra-agent
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

web:
  host: 0.0.0.0
  port: 8080

mqtt:
  enabled: false
  host: ""
  port: 1883
  username: ""
  passwordSecretName: ""
  discoveryPrefix: homeassistant

jobs:
  proxmox:
    enabled: true
    name: Proxmox Cluster
    interval: 60s
    timeout: 3s
    mqttTopic: home/proxmox
    targets:
      home-lab-0: 192.168.1.51
      home-lab-1: 192.168.1.52
      home-lab-2: 192.168.1.53
  k3s:
    enabled: false
    name: K3s Cluster
    interval: 60s
    timeout: 10s
    mqttTopic: home/k3s
  investory:
    enabled: false
    name: Investory Portfolio
    cron: "0 9-22 * * 1-5"
    timezone: Europe/Warsaw
    timeout: 15s
    mqttTopic: home/investory/portfolio
    databaseUrlSecretName: home-infra-agent-investory-db
    portfolioId: 1

service:
  port: 8080

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix

networkPolicy:
  enabled: true
  kubernetesApiCidr: 10.43.0.1/32
  externalEgressCidrs:
    - 192.168.1.0/24
  investoryEgressCidrs: []

resourceQuota:
  enabled: true
  hard:
    requests.cpu: 250m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 512Mi
    pods: "2"
