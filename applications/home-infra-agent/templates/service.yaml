apiVersion: v1
kind: Service
metadata:
  name: {{ include "home-infra-agent.name" . }}
  labels:
    {{- include "home-infra-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "home-infra-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
