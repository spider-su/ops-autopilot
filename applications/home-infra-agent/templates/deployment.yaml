apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "home-infra-agent.name" . }}
  labels:
    {{- include "home-infra-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "home-infra-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "home-infra-agent.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: {{ include "home-infra-agent.name" . }}-config
            items:
              - key: application.yaml
                path: application.yaml
              {{- if .Values.jobs.proxmox.enabled }}
              - key: proxmox-job.yaml
                path: jobs/proxmox/job.yaml
              - key: proxmox-nodes.yaml
                path: jobs/proxmox/nodes.yaml
              {{- end }}
      containers:
        - name: home-infra-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HIA_CONFIG_DIR
              value: /etc/home-infra-agent
            {{- if .Values.mqtt.passwordSecretName }}
            - name: HIA_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.passwordSecretName | quote }}
                  key: password
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/home-infra-agent
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
