apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "home-infra-agent.name" . }}
  labels:
    {{- include "home-infra-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "home-infra-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "home-infra-agent.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "home-infra-agent.name" . }}
      automountServiceAccountToken: {{ .Values.jobs.k3s.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: {{ include "home-infra-agent.name" . }}-config
            items:
              - key: application.yaml
                path: application.yaml
              {{- if .Values.jobs.proxmox.enabled }}
              - key: proxmox-job.yaml
                path: jobs/proxmox/job.yaml
              - key: proxmox-nodes.yaml
                path: jobs/proxmox/nodes.yaml
              {{- end }}
              {{- if .Values.jobs.k3s.enabled }}
              - key: k3s-job.yaml
                path: jobs/k3s/job.yaml
              - key: k3s-cluster.yaml
                path: jobs/k3s/cluster.yaml
              {{- end }}
              {{- if .Values.jobs.investory.enabled }}
              - key: investory-job.yaml
                path: jobs/investory/job.yaml
              - key: investory-performance.yaml
                path: jobs/investory/performance.yaml
              {{- end }}
              {{- if .Values.jobs.solarman.enabled }}
              - key: solarman-job.yaml
                path: jobs/solarman/job.yaml
              - key: solarman-current.yaml
                path: jobs/solarman/current.yaml
              {{- end }}
      containers:
        - name: home-infra-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HIA_CONFIG_DIR
              value: /etc/home-infra-agent
            {{- if .Values.mqtt.passwordSecretName }}
            - name: HIA_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.passwordSecretName | quote }}
                  key: password
                  optional: true
            {{- end }}
            {{- if .Values.jobs.investory.enabled }}
            - name: HIA_INVESTORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobs.investory.databaseUrlSecretName | quote }}
                  key: url
            {{- end }}
            {{- if .Values.jobs.solarman.enabled }}
            - name: SOLARMAN_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobs.solarman.credentialsSecretName | quote }}
                  key: app-id
                  optional: true
            - name: SOLARMAN_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobs.solarman.credentialsSecretName | quote }}
                  key: app-secret
                  optional: true
            - name: SOLARMAN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobs.solarman.credentialsSecretName | quote }}
                  key: email
                  optional: true
            - name: SOLARMAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobs.solarman.credentialsSecretName | quote }}
                  key: password
                  optional: true
            - name: SOLARMAN_DEVICE_SERIAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobs.solarman.credentialsSecretName | quote }}
                  key: device-serial
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/home-infra-agent
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
