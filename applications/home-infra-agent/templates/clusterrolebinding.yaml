{{- if .Values.jobs.k3s.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "home-infra-agent.name" . }}-readonly
  labels:
    {{- include "home-infra-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "home-infra-agent.name" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "home-infra-agent.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
