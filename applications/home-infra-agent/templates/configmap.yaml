apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-infra-agent.name" . }}-config
  labels:
    {{- include "home-infra-agent.labels" . | nindent 4 }}
data:
  application.yaml: |
    web:
      host: {{ .Values.web.host | quote }}
      port: {{ .Values.web.port }}
    mqtt:
      enabled: {{ .Values.mqtt.enabled }}
      host: {{ .Values.mqtt.host | quote }}
      port: {{ .Values.mqtt.port }}
      username: {{ .Values.mqtt.username | quote }}
      passwordEnv: HIA_MQTT_PASSWORD
      discoveryPrefix: {{ .Values.mqtt.discoveryPrefix | quote }}
  proxmox-job.yaml: |
    name: {{ .Values.jobs.proxmox.name | quote }}
    schedule:
      interval: {{ .Values.jobs.proxmox.interval | quote }}
    freshness:
      maxAge: {{ .Values.jobs.proxmox.freshnessMaxAge | quote }}
    timeout: {{ .Values.jobs.proxmox.timeout | quote }}
    mqtt:
      enabled: true
      topic: {{ .Values.jobs.proxmox.mqttTopic | quote }}
      device:
        name: {{ .Values.jobs.proxmox.name | quote }}
        manufacturer: Custom
        model: Proxmox Cluster
  proxmox-nodes.yaml: |
    type: ping
    targets:
      {{- toYaml .Values.jobs.proxmox.targets | nindent 6 }}
  {{- if .Values.jobs.network.enabled }}
  network-job.yaml: |
    name: {{ .Values.jobs.network.name | quote }}
    schedule:
      interval: {{ .Values.jobs.network.interval | quote }}
    timeout: {{ .Values.jobs.network.timeout | quote }}
    freshness:
      maxAge: 30m
    mqtt:
      enabled: true
      topic: {{ .Values.jobs.network.mqttTopic | quote }}
      device:
        name: {{ .Values.jobs.network.name | quote }}
        manufacturer: Custom
        model: Home Infra Agent
  network-reachability.yaml: |
    type: ping
    targets:
      {{- toYaml .Values.jobs.network.targets | nindent 6 }}
  {{- end }}
  {{- if .Values.jobs.speedtest.enabled }}
  speedtest-job.yaml: |
    name: {{ .Values.jobs.speedtest.name | quote }}
    schedule:
      cron: {{ .Values.jobs.speedtest.cron | quote }}
      timezone: {{ .Values.jobs.speedtest.timezone | quote }}
    timeout: {{ .Values.jobs.speedtest.timeout | quote }}
    freshness:
      maxAge: 14h
    mqtt:
      enabled: true
      topic: {{ .Values.jobs.speedtest.mqttTopic | quote }}
      device:
        name: {{ .Values.jobs.speedtest.name | quote }}
        manufacturer: Custom
        model: Home Infra Agent
      entities:
        ping_ms: {name: Speedtest latency, unit_of_measurement: ms, device_class: duration, state_class: measurement}
        download_mbps: {name: Speedtest download, unit_of_measurement: Mbit/s, device_class: data_rate, state_class: measurement}
        upload_mbps: {name: Speedtest upload, unit_of_measurement: Mbit/s, device_class: data_rate, state_class: measurement}
        server_name: {name: Speedtest server}
        server_country: {name: Speedtest country}
        server_id: {name: Speedtest server ID}
        tested_at: {name: Speedtest source timestamp, device_class: timestamp}
  speedtest-measure.yaml: |
    type: speedtest
  {{- end }}
  {{- if .Values.jobs.k3s.enabled }}
  k3s-job.yaml: |
    name: {{ .Values.jobs.k3s.name | quote }}
    schedule:
      interval: {{ .Values.jobs.k3s.interval | quote }}
    freshness:
      maxAge: {{ .Values.jobs.k3s.freshnessMaxAge | quote }}
    timeout: {{ .Values.jobs.k3s.timeout | quote }}
    mqtt:
      enabled: true
      topic: {{ .Values.jobs.k3s.mqttTopic | quote }}
      device:
        name: {{ .Values.jobs.k3s.name | quote }}
        manufacturer: Custom
        model: Kubernetes Cluster
  k3s-cluster.yaml: |
    type: kubernetes
    scope: cluster
  {{- end }}
  {{- if .Values.jobs.investory.enabled }}
  investory-job.yaml: |
    name: {{ .Values.jobs.investory.name | quote }}
    schedule:
      cron: {{ .Values.jobs.investory.cron | quote }}
      timezone: {{ .Values.jobs.investory.timezone | quote }}
    timeout: {{ .Values.jobs.investory.timeout | quote }}
    mqtt:
      enabled: true
      topic: {{ .Values.jobs.investory.mqttTopic | quote }}
      device:
        name: {{ .Values.jobs.investory.name | quote }}
        manufacturer: Investory
        model: Portfolio Performance
  investory-performance.yaml: |
    type: investory_postgres
    databaseUrlEnv: HIA_INVESTORY_DATABASE_URL
    portfolioId: {{ .Values.jobs.investory.portfolioId }}
  {{- end }}
  {{- if .Values.jobs.solarman.enabled }}
  solarman-job.yaml: |
    {{- tpl (.Files.Get "files/solarman/job.yaml") . | nindent 4 }}
  solarman-current.yaml: |
    {{- .Files.Get "files/solarman/current.yaml" | nindent 4 }}
  {{- end }}
