apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-infra-agent.name" . }}-config
  labels:
    {{- include "home-infra-agent.labels" . | nindent 4 }}
data:
  application.yaml: |
    web:
      host: {{ .Values.web.host | quote }}
      port: {{ .Values.web.port }}
    mqtt:
      enabled: {{ .Values.mqtt.enabled }}
      host: {{ .Values.mqtt.host | quote }}
      port: {{ .Values.mqtt.port }}
      username: {{ .Values.mqtt.username | quote }}
      passwordEnv: HIA_MQTT_PASSWORD
      discoveryPrefix: {{ .Values.mqtt.discoveryPrefix | quote }}
  proxmox-job.yaml: |
    name: {{ .Values.jobs.proxmox.name | quote }}
    schedule:
      interval: {{ .Values.jobs.proxmox.interval | quote }}
    timeout: {{ .Values.jobs.proxmox.timeout | quote }}
    mqtt:
      enabled: true
      topic: {{ .Values.jobs.proxmox.mqttTopic | quote }}
      device:
        name: {{ .Values.jobs.proxmox.name | quote }}
        manufacturer: Custom
        model: Proxmox Cluster
  proxmox-nodes.yaml: |
    type: ping
    targets:
      {{- toYaml .Values.jobs.proxmox.targets | nindent 6 }}
