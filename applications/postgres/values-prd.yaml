# NOTE: storage stays at 10Gi. A StatefulSet's volumeClaimTemplates is immutable,
# so growing it via GitOps would make Argo's apply fail. The temp_file_limit guardrail
# below caps per-session temp at 4Gi, protecting this 10Gi volume during heavy refreshes.
# PVC expansion (if ever needed) is a separate manual op: allowVolumeExpansion on the
# storageClass + kubectl edit pvc, documented in the runbook.
storage:
  size: 10Gi

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 2Gi

resourceQuota:
  hard:
    # Guaranteed postgres-0 (requests == limits: 1000m / 2Gi) plus the monthly
    # backup Job (requests 50m / 128Mi, limits 250m / 512Mi). Headroom to 3Gi / 3 cores.
    requests.cpu: "1500m"
    requests.memory: "3Gi"
    limits.cpu: "3"
    limits.memory: "3Gi"

postgresConfig:
  # 2Gi pod: keep more of the working set (indexes + hot heap pages) cached so
  # simple reads stay off the heap. Well within the 2Gi limit alongside
  # work_mem * connections + maintenance_work_mem.
  sharedBuffers: "256MB"
  workMem: "16MB"
  maintenanceWorkMem: "128MB"
  effectiveCacheSize: "1GB"
  tempFileLimit: "4GB"

# Immutable manifest-list digest resolved from the production image registry on 2026-08-30.
image:
  digest: sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
  pullPolicy: IfNotPresent

# Ceph RBD is available on every node; leave scheduling flexible so CSI can
# reattach this RWO volume after a node failure.
nodeSelector: {}

backup:
  enabled: true
  imageDigest: sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94

