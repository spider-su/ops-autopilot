image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

postgresConfig:
  sharedBuffers: "128MB"
  workMem: "8MB"
  maintenanceWorkMem: "32MB"
  maxConnections: "50"

storage:
  size: 5Gi
  storageClassName: proxmox-ceph-rbd
  mountPath: /var/lib/postgresql/data

service:
  port: 5432

# Secret name holding POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
# Pre-create with kubectl before first sync — never stored in git.
credentials:
  secretName: postgres-credentials

resourceQuota:
  enabled: true
  hard:
    # Reserve headroom for the monthly backup Job alongside PostgreSQL.
    # Memory: postgres-0 (512Mi) + backup job (512Mi) = 1Gi, rounded to 2Gi for safety margin.
    # CPU: postgres-0 (500m) + backup job (250m) = 750m, rounded to 2000m (2 cores) for system pods.
    requests.cpu: "200m"
    requests.memory: "512Mi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "5"

networkPolicy:
  enabled: true
  # Namespaces allowed to connect to PostgreSQL on port 5432.
  allowedNamespaces:
    - investory-prod
    - investory-dev
    - smartapp-prod
    - smartapp-dev
    - ingress-nginx
    - monitoring

pdb:
  # PostgreSQL is intentionally a singleton. A minAvailable: 1 PDB cannot
  # provide availability and would block voluntary node drains/maintenance.
  enabled: false

nodeSelector: {}

backup:
  enabled: false
  schedule: "0 3 1 * *"
  storage:
    size: 10Gi
    storageClassName: proxmox-ceph-rbd
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  imageDigest: ""
