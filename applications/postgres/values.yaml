image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

postgresConfig:
  sharedBuffers: "128MB"
  workMem: "8MB"
  maintenanceWorkMem: "64MB"
  maxConnections: "50"
  effectiveCacheSize: "256MB"
  # Hard per-session cap on temporary file bytes. A runaway sort/hash (e.g. an
  # unoptimized materialized-view refresh) aborts cleanly instead of filling the
  # data volume and taking PostgreSQL down.
  tempFileLimit: "2GB"
  # Reap sessions left idle *inside a transaction* so timed-out client requests do
  # not leave orphaned work holding connections/locks. Set to 10m to match the
  # liveness window: the app runs one multi-step transaction per market-price update
  # (a multi-minute CPU read, then Java-side processing, then the MV refreshes), so a
  # shorter timeout would abort that legitimate workflow before it refreshes the MVs.
  idleInTransactionSessionTimeout: "600s"
  # Keep slots for probes/admin so PostgreSQL stays reachable under saturation.
  superuserReservedConnections: "3"
  # Log every temp-file spill for observability.
  logTempFiles: "0"
  # Autovacuum tuning. After a bulk write (e.g. a materialized-view refresh or an
  # import) the visibility map goes stale, forcing heap fetches on index-only scans
  # and leaving planner stats behind. Tighter thresholds and a shorter naptime keep
  # the visibility map and stats fresh so simple reads stay fast without heap fetches.
  autovacuumNaptime: "30s"
  autovacuumVacuumScaleFactor: "0.1"
  autovacuumAnalyzeScaleFactor: "0.05"
  autovacuumVacuumInsertScaleFactor: "0.1"

# Grace period for a clean PostgreSQL shutdown. The preStop hook triggers a fast
# shutdown (aborts running queries, checkpoints, exits cleanly); this window must be
# long enough for that checkpoint to finish so the next start skips crash recovery
# (which would reset cumulative stats and replay WAL).
terminationGracePeriodSeconds: 120

storage:
  size: 5Gi
  storageClassName: proxmox-ceph-rbd
  mountPath: /var/lib/postgresql/data

service:
  port: 5432

# Secret name holding POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
# Pre-create with kubectl before first sync — never stored in git.
credentials:
  secretName: postgres-credentials

resourceQuota:
  enabled: true
  hard:
    # Reserve headroom for the monthly backup Job alongside PostgreSQL.
    # Memory: postgres-0 (512Mi) + backup job (512Mi) = 1Gi, rounded to 2Gi for safety margin.
    # CPU: postgres-0 (500m) + backup job (250m) = 750m, rounded to 2000m (2 cores) for system pods.
    requests.cpu: "200m"
    requests.memory: "512Mi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "5"

networkPolicy:
  enabled: true
  # Namespaces allowed to connect to PostgreSQL on port 5432.
  allowedNamespaces:
    - investory-prod
    - investory-dev
    - smartapp-prod
    - smartapp-dev
    - ingress-nginx
    - monitoring

pdb:
  # PostgreSQL is intentionally a singleton. A minAvailable: 1 PDB cannot
  # provide availability and would block voluntary node drains/maintenance.
  enabled: false

nodeSelector: {}

backup:
  enabled: false
  schedule: "0 3 1 * *"
  storage:
    size: 10Gi
    storageClassName: proxmox-ceph-rbd
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  imageDigest: ""
