image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

postgresConfig:
  sharedBuffers: "128MB"
  workMem: "8MB"
  maintenanceWorkMem: "32MB"
  maxConnections: "50"

storage:
  size: 5Gi
  storageClassName: proxmox-ceph-rbd
  mountPath: /var/lib/postgresql/data

service:
  port: 5432

# Secret name holding POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
# Pre-create with kubectl before first sync — never stored in git.
credentials:
  secretName: postgres-credentials

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "100m"
    requests.memory: "256Mi"
    limits.cpu: "2"
    limits.memory: "1Gi"
    pods: "5"

networkPolicy:
  enabled: true
  # Namespaces allowed to connect to PostgreSQL on port 5432.
  allowedNamespaces:
    - investory-prod
    - investory-dev
    - smartapp-prod
    - smartapp-dev
    - ingress-nginx
    - monitoring

pdb:
  enabled: true

nodeSelector: {}
