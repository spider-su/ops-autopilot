# Credential scaffold — /data is excluded from Argo CD diff via ignoreDifferences.
# Pre-create the real secret before first sync:
#
#   kubectl create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD=<your-password> \
#     --from-literal=POSTGRES_DB=postgres \
#     --namespace=postgres-prd --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data: {}

