replicaCount: 1

image:
  repository: aserobaba/investory
  tag: latest
  pullPolicy: Always

containerPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 2Gi

probes:
  enabled: true
  startup:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 5
    # Hibernate/Flyway startup is slow on the homelab nodes; keep the probe
    # strict after startup while allowing the measured cold-start duration.
    failureThreshold: 60
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

service:
  port: 80
  targetPort: 8080

# Non-sensitive config — safe to store in git
config:
  DB_URL: "jdbc:postgresql://postgres.postgres.svc.cluster.local:5432/inventory"
  GOOGLE_CLIENT_ID: "61359240267-35d5q59j0turdjk5fu22vq3rvoia7i19.apps.googleusercontent.com"
  TELEGRAM_BOT_USERNAME: "investory_adviser_mega_bot"
  TELEGRAM_CHAT_ID: "705026016"

# Sensitive config — applied manually via kubectl, never stored in git
# kubectl create secret generic investory-secrets \
#   --from-literal=DB_USERNAME=postgres \
#   --from-literal=DB_PASSWORD=<password> \
#   --from-literal=GOOGLE_CLIENT_SECRET=<secret> \
#   --from-literal=TWELVEDATA_API_KEY=<key> \
#   --from-literal=EXCHANGERATE_API_KEY=<key> \
#   --from-literal=TELEGRAM_BOT_TOKEN=<token> \
#   --namespace=investory-prod --dry-run=client -o yaml | kubectl apply -f -
secrets:
  secretName: investory-secrets

pvc:
  enabled: false
  storageClassName: proxmox-ceph-rbd
  size: 1Gi
  mountPath: /data

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "500m"
    requests.memory: "256Mi"
    limits.cpu: "2"
    limits.memory: "512Mi"
    pods: "10"

networkPolicy:
  enabled: true
  # Extra namespaces allowed to reach this app (in addition to ingress-nginx + monitoring)
  extraIngressNamespaces: []
  # External destinations required by the application. Narrow this list to approved CIDRs when known.
  externalEgressCidrs:
    - 0.0.0.0/0

topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
