# Production overrides for investory
# Enabled again after the database-schema fix image was published.
replicaCount: 1

# The Spring Boot/Hibernate image is CPU-intensive during startup and, more
# importantly, during the synchronous all-account projection rebuild triggered by a
# market-price update. That rebuild is single-threaded (~1 core); with a 1-core
# limit it starved the web/probe threads (CFS-throttled), so liveness AND readiness
# HTTP probes timed out and the pod dropped to NotReady mid-rebuild. A 2-core limit
# lets the rebuild run on one core while probe/HTTP threads keep the second, so the
# app stays responsive. The Recreate strategy keeps peak usage at one pod, so this
# stays within the namespace quota (limits.cpu: 2). Requests stay at the base 500m.
resources:
  limits:
    cpu: 2000m
    memory: 2048Mi

# Allow the synchronous all-account projection to remain unresponsive for up
# to ten minutes before Kubernetes restarts the application. The readiness timeout
# is widened to 10s so a briefly-busy event loop during the rebuild does not flap
# the pod out of service.
probes:
  readiness:
    timeoutSeconds: 10
  liveness:
    failureThreshold: 30

# K3S ACC: latest published Investory image, commit 91224302; scan passed on 2026-10-10.
image:
  digest: sha256:95cdd5a845b6a1d1609369c291fe1d3c00efb2eafd487f885bdf2fbc79d0b31d
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: investory.home.k3s.com

# Quota for one active replica plus one temporary replacement during a rolling update.
resourceQuota:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"
    pods: "10"
