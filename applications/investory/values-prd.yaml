# Production overrides for investory
# Enabled again after the database-schema fix image was published.
replicaCount: 1

# The current Spring Boot/Hibernate image is CPU-intensive during startup.
# Keep the request unchanged while allowing startup to use one vCPU.
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi

# Immutable manifest-list digest resolved from the production image registry on 2026-08-30.
#image:
#  digest: sha256:8864197c4979001d10735071700d234303f711ea7e27a6a2305e340f9511fca1
#  pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: investory.home.k3s.com

# Quota for one active replica plus one temporary replacement during a rolling update.
resourceQuota:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"
    pods: "10"
