# Production overrides for investory
# Enabled again after the database-schema fix image was published.
replicaCount: 1

# The current Spring Boot/Hibernate image is CPU-intensive during startup.
# Keep the request unchanged while allowing startup to use one vCPU.
resources:
  limits:
    cpu: 1

ingress:
  enabled: true
  host: investory.home.k3s.com

# Override quota for 2 replicas of Spring Boot (2 × 512Mi = 1Gi)
resourceQuota:
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "4Gi"
    pods: "10"
