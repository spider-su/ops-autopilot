# Production overrides for investory
# Temporarily paused while the next image fixes the database-schema mismatch.
replicaCount: 0

ingress:
  enabled: true
  host: investory.home.k3s.com

# Override quota for 2 replicas of Spring Boot (2 × 512Mi = 1Gi)
resourceQuota:
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "10"
