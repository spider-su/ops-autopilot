image:
  repository: aserobaba/orchestrator
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

dashboard:
  replicas: 1
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

config:
  ORCHESTRATOR_SCHEMA: investory_orchestrator
  GITHUB_REPOSITORY: spider-su/investory
  GITHUB_APP_ID: "4494035"
  GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app/app.pem
  GITHUB_NOTIFY_LOGIN: spider-su
  GITHUB_PRIORITY_FIELD: Priority
  BASE_BRANCH: develop
  MAC_SSH_TARGET: alex@192.168.1.7
  MAC_SSH_KEY_PATH: /run/secrets/mac-runner/id_ed25519
  MAC_SSH_KNOWN_HOSTS: /run/secrets/mac-runner/known_hosts
  MAX_ACTIVE_TASKS: "1"
  MAX_CODEX_PROCESSES: "1"
  MAX_BUILDS: "1"
  QUEUE_POLL_SECONDS: "20"

secrets:
  runtimeName: orchestrator-runtime
  sshName: mac-runner-ssh

networkPolicy:
  enabled: true
  externalEgressCidrs:
    - 0.0.0.0/0

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "500m"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "5"
