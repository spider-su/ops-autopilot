apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-dashboard
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: investory-orchestrator
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investory-orchestrator
        app.kubernetes.io/component: dashboard
    spec:
      {{- include "orchestrator.podSecurityContext" . | nindent 6 }}
      {{- include "orchestrator.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: dashboard
          image: {{ include "orchestrator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uvicorn", "app.dashboard:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
          {{- include "orchestrator.containerSecurityContext" . | nindent 10 }}
          envFrom:
            - configMapRef:
                name: investory-orchestrator-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtimeName }}
                  key: database-url
            - name: DASHBOARD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtimeName }}
                  key: dashboard-api-token
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
