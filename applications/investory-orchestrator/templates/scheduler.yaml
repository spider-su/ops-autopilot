apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-scheduler
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: investory-orchestrator
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investory-orchestrator
        app.kubernetes.io/component: scheduler
    spec:
      {{- include "orchestrator.podSecurityContext" . | nindent 6 }}
      {{- include "orchestrator.imagePullSecrets" . | nindent 6 }}
      volumes:
        - name: mac-runner
          secret:
            secretName: {{ .Values.secrets.sshName }}
            defaultMode: 0400
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: known_hosts
                path: known_hosts
        - name: github-app-key
          secret:
            secretName: {{ .Values.secrets.runtimeName }}
            defaultMode: 0400
            items:
              - key: github-app-private-key
                path: app.pem
      containers:
        - name: scheduler
          image: {{ include "orchestrator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app", "--run-queue"]
          {{- include "orchestrator.containerSecurityContext" . | nindent 10 }}
          envFrom:
            - configMapRef:
                name: investory-orchestrator-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtimeName }}
                  key: database-url
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtimeName }}
                  key: github-installation-id
          volumeMounts:
            - name: mac-runner
              mountPath: /run/secrets/mac-runner
              readOnly: true
            - name: github-app-key
              mountPath: /run/secrets/github-app
              readOnly: true
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 15
            periodSeconds: 30
