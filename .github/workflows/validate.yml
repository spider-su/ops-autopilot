name: Validate manifests

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install validation dependencies
        shell: bash
        run: python -m pip install --requirement tools/requirements.txt
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
      - name: Install kubeconform
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar --extract --gzip --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run repository validation
        shell: pwsh
        run: ./scripts/validate.ps1
